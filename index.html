<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 종료 안내 - 굿윌스토어</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .closed-card {
            background: white;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            background-color: #0066b2;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #004d85;
        }
    </style>
</head>
<body>
    <div class="closed-card">
        <div class="icon">🎁</div>
        <h2>이벤트가 종료되었습니다</h2>
        <p>
            보내주신 성원에 감사드립니다.<br>
            본 영수증 인증 이벤트는 마감되었습니다.<br>
            다음 이벤트에서 더욱 알찬 혜택으로 찾아뵙겠습니다.
        </p>
        <a href="https://goodwillstorekorea.github.io" class="btn">굿윌스토어 홈으로 이동</a>
    </div>
</body>
</html>
