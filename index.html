<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영수증 인증 이벤트</title>
    <!-- 3번: 구글 reCAPTCHA 스크립트 로드 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <h2>영수증 인증 이벤트 참여</h2>
    <form id="uploadForm">
        <label>이름: <input type="text" id="name" required></label><br><br>
        <label>연락처: <input type="text" id="phone" required></label><br><br>
        
        <p>※ 카드번호, 승인번호 등 민감정보는 반드시 가린 후 업로드해주세요.</p>
        <input type="file" id="receiptFile" accept="image/*" required><br><br>

        <!-- 4번: 개인정보 수집 및 이용 안내문 상자 추가 -->
        <div style="border: 1px solid #ccc; padding: 10px; font-size: 13px; margin-bottom: 10px; background-color: #f9f9f9;">
            <strong>[개인정보 수집 및 이용 동의]</strong><br>
            1. 수집 목적: 매장 이용 인증 및 이벤트 혜택 지급<br>
            2. 수집 항목: 이름, 연락처, 영수증 내역(결제일시, 금액, 매장명 등)<br>
            3. 보유 및 이용 기간: <strong>이벤트 종료 및 혜택 지급 완료 후 1개월 내 파기</strong><br>
            ※ 동의를 거부할 권리가 있으나, 거부 시 이벤트 참여가 불가합니다.
        </div>
        <label>
            <input type="checkbox" id="privacyAgree" required> 
            (필수) 위 개인정보 수집 및 이용 내용에 동의합니다.
        </label><br><br>

        <!-- 3번: reCAPTCHA 위젯이 표시될 자리 -->
        <!-- 아래 data-sitekey 따옴표 안에 발급받은 '사이트 키'를 넣으세요! -->
        <div class="g-recaptcha" data-sitekey="6LenMOMtAAAAAD247nQFdAkCQg2u3j3wt7diLZ4A"></div><br>

        <button type="submit">제출하기</button>
    </form>

    <script>
        const form = document.getElementById('uploadForm');
        
        // ★ 주의: 이전에 복사해둔 구글 앱스 스크립트 웹 앱 URL(exec로 끝나는 주소)을 다시 넣어주세요!
        const gasUrl = 'https://script.google.com/macros/s/AKfycbw3ZpxHX9MY2yUImujARDApaDdzx8JHnxwMdqxplBsIG9STqdv1SouP8fH-kqECzn4m3g/exec'; 

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 3번: 봇 방지 (reCAPTCHA 체크 여부 확인)
            const recaptchaResponse = grecaptcha.getResponse();
            if (recaptchaResponse.length === 0) {
                alert("자동가입 방지를 위해 '로봇이 아닙니다'를 체크해주세요.");
                return; // 제출 중단
            }

            const fileInput = document.getElementById('receiptFile').files[0];
            if (!fileInput) return alert("파일을 선택해주세요.");

            // 제출 중일 때 버튼 텍스트 변경
            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.innerText = "제출 중...";
            submitBtn.disabled = true;

            const reader = new FileReader();
            reader.onload = function(event) {
                const payload = {
                    name: document.getElementById('name').value,
                    phone: document.getElementById('phone').value,
                    fileName: fileInput.name,
                    mimeType: fileInput.type,
                    fileData: event.target.result
                };

                fetch(gasUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(data => {
                    if(data.result === 'success') {
                        alert("성공적으로 제출되었습니다!");
                        form.reset();
                        grecaptcha.reset(); // 성공 시 리캡차 초기화
                    } else {
                        alert("오류가 발생했습니다: " + data.message);
                    }
                })
                .catch(error => alert("전송 실패: " + error))
                .finally(() => {
                    // 성공/실패 상관없이 버튼 원상복구
                    submitBtn.innerText = "제출하기";
                    submitBtn.disabled = false;
                });
            };
            
            reader.readAsDataURL(fileInput); 
        });
    </script>
</body>
</html>
